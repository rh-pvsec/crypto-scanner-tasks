---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sast-crypto-scan
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: "konflux, cbom"
  labels:
    app.kubernetes.io/version: "0.3.3"
spec:
  description: >-
    The sast-crypto-scan task uses [crypto-finder-image](https://github.com/rh-pvsec/crypto-finder-image) tool to perform Static Code Analysis in order to detect crypto assets being used.
    It reports crypto algorithms in a CycloneDX format (cbom.json).
  params:
    - name: TARGET_DIRS
      description: Target directories in component's source code. Multiple values should be separated with commas.
      type: string
      default: "."
    - name: SKIP_SBOM_GENERATION
      description: Skip SBOM-related operations. This will likely cause EC policies to fail if enabled
      type: string
      default: "false"
    - name: SCAN_TIMEOUT
      description: Timeout scan if it takes more than the time specified.
      type: string
      default: "30m"
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from.
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data.
      type: string
      default: ca-bundle.crt
    - name: image-url
      description: Image URL.
      type: string
      default: ""
    - name: image-digest
      description: Digest of the image to scan.
      type: string
      default: ""
    - name: FORCE_CBOM
      description: Force CBOM generation even if enable-cbom-generation-task is false or not set in the cluster-config ConfigMap.
      type: string
      default: "false"
    - name: FORCE_RULES_IMAGE
      description: Override the additional rules image regardless of the cluster-config ConfigMap value.
      type: string
      default: ""
  results:
    - name: CBOM_BLOB_URL
      description: Digest-qualified reference to the attached cbom.json blob. Empty when upload is skipped.
    - name: TEST_OUTPUT
      description: Tekton task test output.
  volumes:
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
    - name: bound-token
      projected:
        sources:
          - serviceAccountToken:
              audience: openshift
              expirationSeconds: 7200
              path: quay-token
  workspaces:
    - name: workspace
  steps:
    - name: pull-rules
      image: quay.io/konflux-ci/task-runner:2.1.0@sha256:c34c933c269e2401bb042fe69e2999cf288331b6586d4f4eca9c845270d9b1f9
      when:
        - input: "$(params.SKIP_SBOM_GENERATION)"
          operator: notin
          values: [ "true" ]
      volumeMounts:
        - name: bound-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
      computeResources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
      env:
        - name: FORCE_CBOM
          value: $(params.FORCE_CBOM)
        - name: FORCE_RULES_IMAGE
          value: $(params.FORCE_RULES_IMAGE)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        WARNINGS_DIR="$(workspaces.workspace.path)/$(context.task.name)"

        # Record a warning marker that the rh-crypto-scanner step folds into
        # TEST_OUTPUT, so a scan degraded to open-source rules only is visible
        # downstream instead of reporting a clean success. Ends the step.
        warn_and_exit() {
          echo "WARNING: $*"
          echo "Falling back to use only Open Source Rules"
          mkdir -p "${WARNINGS_DIR}"
          echo -n 1 > "${WARNINGS_DIR}/warnings"
          exit 0
        }

        # The exit status of each cluster-config lookup is captured separately
        # from its output so that a genuine lookup failure (an RBAC denial or an
        # API-server error) is not mistaken for an opt-out. --ignore-not-found
        # keeps a cluster that has no cluster-config ConfigMap at all on the
        # opt-out path: like an absent or empty key, the lookup then exits 0
        # with no output and the scan skips proprietary rules without warning.
        if [[ "${FORCE_CBOM}" != "true" ]]; then
          set +e
          ENABLE_CBOM=$(oc get configmap cluster-config -n konflux-info --ignore-not-found \
            -o jsonpath='{.data.enable-cbom-generation-task}')
          OC_STATUS=$?
          set -e

          if [[ "${OC_STATUS}" -ne 0 ]]; then
            warn_and_exit "Unable to read 'enable-cbom-generation-task' from the cluster-config ConfigMap in the konflux-info namespace (oc exited with ${OC_STATUS})"
          fi

          if [[ "${ENABLE_CBOM}" != "true" ]]; then
            echo "CBOM generation task is not enabled on this cluster (enable-cbom-generation-task='${ENABLE_CBOM}'). Skipping proprietary rules."
            exit 0
          fi
        fi

        if [[ -n "${FORCE_RULES_IMAGE}" ]]; then
          ADDITIONAL_RULES_IMAGE="${FORCE_RULES_IMAGE}"
        else
          set +e
          ADDITIONAL_RULES_IMAGE=$(oc get configmap cluster-config -n konflux-info --ignore-not-found \
            -o jsonpath='{.data.additional-cbom-generation-rules-image}')
          OC_STATUS=$?
          set -e

          if [[ "${OC_STATUS}" -ne 0 ]]; then
            warn_and_exit "Unable to read 'additional-cbom-generation-rules-image' from the cluster-config ConfigMap in the konflux-info namespace (oc exited with ${OC_STATUS})"
          fi

          if [[ -z "${ADDITIONAL_RULES_IMAGE}" ]]; then
            echo "No additional rules image configured (additional-cbom-generation-rules-image not set). Using only open-source rules."
            exit 0
          fi
        fi

        REGISTRY_HOSTNAME=${ADDITIONAL_RULES_IMAGE%%/*}

        if [[ "${REGISTRY_HOSTNAME}" == "quay.io" ]] ; then
          echo "Using image from quay.io using robot federated account"
          # Use bounded token with quay.io federated robot account
          ROBOT_ACCOUNT="exd-guild-security+konflux_crypto_rules_pull"
        else
          echo "Using image from internal openshift registry"
          ROBOT_ACCOUNT=""
          # Trust internal ca bundle to connect to internal openshift registry
          export SSL_CERT_FILE=/var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
        fi

        # If we need authentication
        if [ -n "${ROBOT_ACCOUNT}" ] ; then
          TOKEN=$(cat /var/run/secrets/tokens/quay-token)
          if [ -z "${TOKEN}" ]; then
            echo "No bound token available"
            exit 1
          fi

          set +e
          SL_TOKEN=$(curl -s --fail \
            --user "${ROBOT_ACCOUNT}:${TOKEN}" \
            "https://${REGISTRY_HOSTNAME}/oauth2/federation/robot/token" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          set -e

          if [ -n "${SL_TOKEN}" ] ; then
            export XDG_RUNTIME_DIR=/tmp/oc-run
            mkdir -p -m 0700 "${XDG_RUNTIME_DIR}"
            oc registry login --registry="${REGISTRY_HOSTNAME}" --auth-basic="${ROBOT_ACCOUNT}:${SL_TOKEN}"
          else
            warn_and_exit "Unable to authenticate to ${REGISTRY_HOSTNAME} with ${ROBOT_ACCOUNT} and bound token"
          fi
        fi

        mkdir /workspace/rules
        echo "About to download image ${ADDITIONAL_RULES_IMAGE}"
        retry oc image extract "${ADDITIONAL_RULES_IMAGE}" --path="/rules/:/workspace/rules"

    - name: rh-crypto-scanner
      image: quay.io/exd-guild-security/crypto-finder-image@sha256:455cefb8ccdccbbda049e29e2991859154cd7dad50a3550db6c0adcce1f831a1
      workingDir: $(workspaces.workspace.path)/hacbs/$(context.task.name)
      env:
        - name: TARGET_DIRS
          value: $(params.TARGET_DIRS)
        - name: SCAN_TIMEOUT
          value: $(params.SCAN_TIMEOUT)
        - name: SKIP_SBOM_GENERATION
          value: $(params.SKIP_SBOM_GENERATION)
        - name: WORKSPACE_PATH
          value: $(workspaces.workspace.path)
        - name: BUILD_PLR_LOG_URL
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['pipelinesascode.tekton.dev/log-url']
      computeResources:
        limits:
          memory: 8Gi
        requests:
          cpu: "4"
          memory: 2Gi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        echo "Using crypto-finder version:"
        crypto-finder version

        echo "Using opengrep version: $(opengrep  --version)"

        OUTPUT_FILE="cbom.json"
        SOURCE_CODE_DIR="${WORKSPACE_PATH}/source"

        # generate full path for each dirname separated by comma
        declare -a ALL_TARGETS
        IFS="," read -ra TARGET_ARRAY <<<"$TARGET_DIRS"
        for d in "${TARGET_ARRAY[@]}"; do
          potential_path="${SOURCE_CODE_DIR}/${d}"

          resolved_path=$(realpath -m "$potential_path")

          # ensure resolved path is still within SOURCE_CODE_DIR
          if [[ "$resolved_path" == "${SOURCE_CODE_DIR}/"* || "$resolved_path" == "$SOURCE_CODE_DIR" ]]; then
            ALL_TARGETS+=("$resolved_path")
          else
            echo "Error: path traversal attempt, '$potential_path' is outside '$SOURCE_CODE_DIR'"
            exit 1
          fi
        done

        # Generate rules arguments
        # This includes the open source rule sets provided by the image in /usr/local/rules
        # and the proprietary rules provided by previous step in /workspace/rules
        declare -a RULES_ARGUMENTS=()
        for d in /usr/local/rules/* /workspace/rules/*; do
          if [ -d "${d}" ] ; then
            echo "Adding '$(basename $d)' rules directory"
            RULES_ARGUMENTS+=("--rules-dir")
            RULES_ARGUMENTS+=("$d")
          fi
        done

        if [ "${SKIP_SBOM_GENERATION}" = "true" ]; then
          RESULT="SKIPPED"
          SUCCESSES="0"
          FAILURES="0"
        elif [ ${#RULES_ARGUMENTS[@]} -eq 0 ]; then
          echo "Error: no rules detected"
          RESULT="ERROR"
          SUCCESSES="0"
          FAILURES="1"
        else
          RESULT="SUCCESS"
          SUCCESSES="1"
          FAILURES="0"
          if [ -f "$(workspaces.workspace.path)/$(context.task.name)/warnings" ]; then
            WARNINGS=$(cat "$(workspaces.workspace.path)/$(context.task.name)/warnings")
            RESULT="WARNING"
          fi

          echo "Running crypto scanner on the specified targets"
          crypto-finder \
            scan \
            --no-remote-rules \
            "${RULES_ARGUMENTS[@]}" \
            --format cyclonedx \
            --timeout "${SCAN_TIMEOUT}" \
            "${ALL_TARGETS[@]}" > "${OUTPUT_FILE}"
        fi

        TEST_OUTPUT=$(echo "{\"result\":\"${RESULT}\",\"timestamp\":\"$(date -u --iso-8601=seconds)\",\"failures\":${FAILURES},\"successes\":${SUCCESSES},\"warnings\":${WARNINGS:-0}}")
        echo "${TEST_OUTPUT}" | tee "$(results.TEST_OUTPUT.path)"

    - name: update-cbom-metadata
      image: quay.io/konflux-ci/mobster:2.4.0-1793708943@sha256:fda0813ff900be453349bcbec5489d7f9e6fd0aca1a1bf3bef1864f51f98fd26
      workingDir: $(workspaces.workspace.path)/hacbs/$(context.task.name)
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
        - name: SKIP_SBOM_GENERATION
          value: $(params.SKIP_SBOM_GENERATION)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        
        if [ -z "${IMAGE_URL}" ] || [ -z "${IMAGE_DIGEST}" ]; then
          echo 'No image-url or image-digest param provided. Skipping metadata update.'
          exit 0
        fi

        if [ "${SKIP_SBOM_GENERATION}" = "true" ]; then
          echo 'Skipping SBOM generation. Skipping metadata update.'
          exit 0
        fi
        
        CBOM_FILES="cbom.json"
        
        for CBOM_FILE in ${CBOM_FILES}; do
          if [ ! -f "${CBOM_FILE}" ]; then
            echo "No ${CBOM_FILE} exists. Skipping metadata update."
            continue
          fi
          mobster generate \
            --output "$CBOM_FILE" oci-cbom \
            --image-pullspec "$IMAGE_URL" \
            --image-digest "$IMAGE_DIGEST" \
            --cbom-path "$CBOM_FILE"
        done
      computeResources:
        limits:
          memory: 512Mi
        requests:
          memory: 512Mi
          cpu: 100m
      securityContext:
        runAsUser: 0

    - name: upload
      image: quay.io/konflux-ci/oras:latest@sha256:da693a7dcbadafc9f4422ae6600b41b2847944f7f14c5622827d6f58c727cf08
      workingDir: $(workspaces.workspace.path)/hacbs/$(context.task.name)
      volumeMounts:
        - mountPath: /etc/pki/tls/certs/ca-custom-bundle.crt
          name: trusted-ca
          readOnly: true
          subPath: ca-bundle.crt
      env:
        - name: IMAGE_URL
          value: $(params.image-url)
        - name: IMAGE_DIGEST
          value: $(params.image-digest)
        - name: SKIP_SBOM_GENERATION
          value: $(params.SKIP_SBOM_GENERATION)
      computeResources:
        limits:
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 256Mi
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        : > "$(results.CBOM_BLOB_URL.path)"

        if [ -z "${IMAGE_URL}" ] || [ -z "${IMAGE_DIGEST}" ]; then
          echo 'No image-url or image-digest param provided. Skipping upload.'
          exit 0
        fi

        if [ "${SKIP_SBOM_GENERATION}" = "true" ]; then
          echo 'Skipping SBOM generation. Skipping upload.'
          exit 0
        fi

        UPLOAD_FILES="cbom.json"
        for UPLOAD_FILE in ${UPLOAD_FILES}; do
          if [ ! -f "${UPLOAD_FILE}" ]; then
            echo "No ${UPLOAD_FILE} exists. Skipping upload."
            continue
          fi

          # Determine the media type based on the file extension
          if [[ "${UPLOAD_FILE}" == *.json ]]; then
            MEDIA_TYPE="application/json"
          else
            MEDIA_TYPE="application/sarif+json"
          fi

          echo "Selecting auth"
          select-oci-auth "$IMAGE_URL" >"$HOME/auth.json"
          echo "Attaching to ${IMAGE_URL}"
          if ! CBOM_REFERENCE=$(retry oras attach --no-tty --registry-config "$HOME/auth.json" \
            --artifact-type "${MEDIA_TYPE}" \
            --format go-template --template '{{.reference}}' \
            "${IMAGE_URL}@${IMAGE_DIGEST}" "${UPLOAD_FILE}:${MEDIA_TYPE}"); then
            echo "Failed to attach ${UPLOAD_FILE} to ${IMAGE_URL}"
            exit 1
          fi

          # ORAS uploads the file unchanged, so its SHA-256 is the blob digest.
          CBOM_DIGEST=$(sha256sum "${UPLOAD_FILE}" | cut -d ' ' -f 1)
          printf '%s@sha256:%s' "${CBOM_REFERENCE%@*}" "${CBOM_DIGEST}" \
            > "$(results.CBOM_BLOB_URL.path)"
        done
        echo "Task $(context.task.name) completed."
