# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
roles:
    - triage
    - coder
    - review
    - fix
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/

tracker:
    github:
        allowed_targets:
            orgs:
                - rh-pvsec
            repos:
                - rh-pvsec/crypto-scanner-tasks
inference:
    project: it-gcp-pvsec-fullsend
    region: global
    provider: vertex
    auth: vertex
    wif_provider: projects/826847573293/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-rh-pvsec-crypto-scanner-tasks

# Setting `trigger` on the `review` entry below moves review routing off the
# dispatch workflow's built-in (bash) rules and onto CEL. Only review moves;
# the other roles listed above keep bash routing. PR #59 added the trigger to
# stop paying for reviews on Konflux/MintMaker PRs, but did not record what
# the switch costs. Issue #77 asked for that to be written down. Three
# consequences were accepted:
#
#   1. Unregistered third-party bots are denied before the trigger is even
#      evaluated. On non-label events the CEL path looks up the *actor's*
#      fullsend role, and a bot with no registered role — or a failed
#      lookup — is skipped. Nothing here registers Konflux/MintMaker or
#      Renovate, so that denial alone keeps review off opened/synchronized/
#      marked_ready events those bots send themselves.
#
#      It is keyed on the actor, not the author, so it stops helping the
#      moment a human acts. When a human pushes to, or marks ready, a
#      Konflux-authored PR, the first disjunct's author clause below is the
#      only thing skipping the review — that gap is exactly what issue #77
#      asked this change to close, so the clause is load-bearing rather
#      than redundant.
#
#      The label path skips the bot-role lookup entirely, and the author
#      clause there matches only the single Konflux login spelled out
#      below. A PR authored by any other unregistered bot — Renovate
#      proper, or a MintMaker instance running under a different login —
#      still dispatches a paid review when it acquires `ready-for-review`.
#   2. A push from the fix agent no longer starts a re-review, so the
#      review -> fix -> re-review loop is off until
#      https://github.com/fullsend-ai/fullsend/issues/8329 ships. This is
#      the cost side of the trade. A re-review can still be asked for by
#      hand with /fs-review.
#   3. A trigger that fails to compile fails *every* agent run in this repo,
#      not just review, because each run validates the whole `agents:` list.
#      Run `fullsend lint` before merging any change to it.
#
# A declarative author-exclusion knob is tracked upstream at
# https://github.com/fullsend-ai/fullsend/issues/4378. If it lands, this
# hand-copied trigger can be dropped and review returns to bash routing,
# which also restores the loop lost in 2.
#
# Issue #60 proposes extending the same author predicate to `retro` and
# `fix`. Doing so moves those stages onto CEL routing too, widening 1 and 2
# to them; decide that deliberately rather than inheriting it.
agents:
  - name: review
    # Copied from the upstream default and unchanged apart from the two
    # author clauses:
    # https://github.com/fullsend-ai/agents/blob/main/harness/review.yaml
    #
    # On the author clauses:
    #   - `state.change_proposal.author_id` is the PR author. `event.actor.id`
    #     (what PR #59 used) is whoever sent the event, so on `synchronized`
    #     it is the pusher and on `label_changed` it is the labeller. Author
    #     is the right test: a human pushing to, or labelling, a
    #     Konflux-authored PR should still not trigger a paid review.
    #   - The `!has(...)` guard is defence-in-depth, not a requirement.
    #     Both author clauses already sit behind
    #     `event.entity.kind == "change_proposal"` and a transition-kind
    #     gate, and the GitHub adapter populates `state.change_proposal`
    #     for every PR event, so the key is present wherever the clause
    #     actually runs. (The upstream example this follows guards a
    #     `work_item`-gated trigger, where it genuinely can be absent.)
    #     It is kept because reading a missing key raises an evaluation
    #     error that counts as "no match" for the disjunct it sits in;
    #     written this way that disjunct fails open (review runs) rather
    #     than closed. The independent `/fs-review` disjunct below is
    #     unaffected either way.
    #   - The bot id is cluster-bound: `kflux-prd-rh02` names the Konflux
    #     cluster this repo is onboarded to. A cluster migration renames the
    #     bot and these clauses will silently stop matching. The
    #     actor-keyed denial in consequence 1 would still cover
    #     opened/synchronized/marked_ready events the bot sends itself,
    #     but a stale id here re-enables dispatch on the label path and
    #     on any human-sent event against a Konflux-authored PR. Update
    #     it together with the cluster.
    trigger: >-
      (
        (event.entity.kind == "change_proposal"
          && event.transition.kind in ["opened", "synchronized", "marked_ready"]
          && (!has(event.state.change_proposal)
            || event.state.change_proposal.author_id != "red-hat-konflux-kflux-prd-rh02[bot]"))
        || (event.entity.kind == "change_proposal"
          && event.transition.kind == "label_changed"
          && event.transition.label.name == "ready-for-review"
          && event.transition.label.action == "added"
          && (!has(event.state.change_proposal)
            || event.state.change_proposal.author_id != "red-hat-konflux-kflux-prd-rh02[bot]"))
        || (event.transition.kind == "comment_added"
          && has(event.transition.comment.command)
          && event.transition.comment.command == "/fs-review"
          && event.actor.kind == "human"
          && (event.entity.kind == "change_proposal"
            || has(event.entity.linked_change_proposal)))
      )
